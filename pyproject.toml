[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medbrief-backend"
version = "0.1.0"
description = "Backend, OCR, laboratory, and MRI analysis services for MedBrief AI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "PyMuPDF>=1.24,<2",
  "Pillow>=10,<12",
  "numpy>=1.26,<3",
  "nibabel>=5.2,<6",
  "pydicom>=3,<4",
  "httpx>=0.27,<1",
  "streamlit>=1.40,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
ocr = ["paddleocr>=2.9,<3", "paddlepaddle>=2.6,<3", "opencv-python-headless>=4.10,<5"]
mri = ["monai>=1.4,<2", "torch>=2.4,<3"]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*", "medbrief_clinical_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
