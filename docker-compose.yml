services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://medbrief:medbrief@db:5432/medbrief
      UPLOAD_DIR: /data/uploads
    volumes: ["uploads:/data/uploads"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: .
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0"]
    ports: ["8501:8501"]
    environment:
      MEDBRIEF_API_URL: http://api:8000
    depends_on: ["api"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medbrief
      POSTGRES_USER: medbrief
      POSTGRES_PASSWORD: medbrief
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbrief"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  uploads:
  postgres:
